<div id="update-info"
     {{ if not ($.Scratch.Get "cardColor") }}
     style="display: none"
     class="flex max-w-prose py-1 mt-2 px-4 rounded-lg bg-primary-100 dark:bg-primary-900"
     {{ else }}
     class="flex max-w-prose py-1 mt-2 px-4 rounded-lg"
     style="background-color: {{ $.Scratch.Get "cardColor" }}"
     {{ end }}>
<span {{ if not ($.Scratch.Get "iconColor") }}
      class="text-primary-400 ltr:pr-3 rtl:pl-3 flex items-center"
      {{ else }}
      class="ltr:pr-3 rtl:pl-3 flex items-center"
      style="color: {{ $.Scratch.Get "iconColor" }}"
      {{ end }}>{{ partial "icon.html" ("circle-info") }}</span>
<span {{ if not ($.Scratch.Get "textColor") }}
      class="dark:text-neutral-300"
      {{ else }}
      style="color: {{ $.Scratch.Get "textColor" }}"
      {{ end }}>
<p style="margin-top: 0px; margin-bottom: 0px;" id="update-text">😄</p>
</span>
</div>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const lastModifiedStr = "{{ .Lastmod.Format "2006-01-02T15:04:05-07:00" }}";
        const lastModified = new Date(lastModifiedStr);
        const now = new Date();
        const diffInMs = now - lastModified;
        const diffInDays = Math.floor(diffInMs / (1000 * 60 * 60 * 24));
        const updateInfoDiv = document.getElementById("update-info");
        const updateTextSpan = document.getElementById("update-text");
        if (diffInDays > 30) {
            if (updateInfoDiv) updateInfoDiv.style.display = "flex";

            const hugoLang = "{{ .Language.Locale | default .Lang }}";
            const userLang = hugoLang || navigator.language;
            const pageLang = new Intl.Locale(userLang);

            const rtf = new Intl.RelativeTimeFormat(pageLang, {numeric: 'always'});
            let timeAgoText = "";
            if (diffInDays >= 365) {
                const years = Math.floor(diffInDays / 365);
                timeAgoText = rtf.format(-years, 'year');
            } else if (diffInDays >= 30) {
                const months = Math.floor(diffInDays / 30);
                timeAgoText = rtf.format(-months, 'month');
            }

            const updateText = `文章最後更新於 ${timeAgoText}，部分內容可能已經過時。`;

            if (updateTextSpan) {
                updateTextSpan.textContent = updateText;
            }
        }
    });
</script>
